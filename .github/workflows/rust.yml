name: Rust

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  wasm:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown, wasm32-wasip1, wasm32-wasip2

    - name: Check browser WebAssembly
      run: cargo check --target wasm32-unknown-unknown

    - name: Check no-std WebAssembly
      run: cargo check --lib --target wasm32-unknown-unknown --no-default-features

    - name: Check WASI Preview 1
      run: cargo check --target wasm32-wasip1

    - name: Check WASI Preview 2
      run: cargo check --target wasm32-wasip2

  lint_and_test:
    strategy: 
      matrix:
        os: [ubuntu, macos, windows]
        toolchain: [stable, nightly]

    runs-on: ${{ matrix.os }}-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install toolchain
      uses: dtolnay/rust-toolchain@v1
      with:
        toolchain: ${{ matrix.toolchain }}
        components: "rustfmt, clippy"
    
    - name: Build
      run: cargo build
      
    - name: Lint
      run: cargo clippy
      
    - name: Check formatting
      run: cargo fmt --check
      
    - name: Run tests
      run: cargo test
